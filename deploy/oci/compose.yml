name: openagent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: open_agent
      POSTGRES_USER: openagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openagent -d open_agent"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 768m
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    restart: unless-stopped
    mem_limit: 256m
    networks: [backend]

  sandbox-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /spool/requests /spool/results && chmod 0700 /spool /spool/requests /spool/results"]
    volumes:
      - sandbox_spool:/spool
    restart: "no"

  sandbox:
    build:
      context: .
      dockerfile: sandbox.Dockerfile
    environment:
      SANDBOX_SPOOL: /spool
    volumes:
      - sandbox_spool:/spool
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL, DAC_OVERRIDE]
    pids_limit: 96
    mem_limit: 512m
    cpus: 0.75
    depends_on:
      sandbox-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.6.8
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 0.85
    networks: [ai, egress]

  app-init:
    image: openagent:oci
    build:
      context: ../..
      dockerfile: deploy/oci/Dockerfile
    environment:
      NODE_ENV: production
      SERVER_FLAVOR: script
      DATABASE_URL: postgresql://openagent:${POSTGRES_PASSWORD}@postgres:5432/open_agent
      REDIS_SERVER_HOST: redis
      REDIS_SERVER_PORT: 6379
      REDIS_SERVER_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./config.json:/app/config.json:ro
      - app_data:/app/data
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy && SERVER_FLAVOR=script node dist/main.mjs run"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    networks: [backend, ai, egress]

  app:
    image: openagent:oci
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://openagent:${POSTGRES_PASSWORD}@postgres:5432/open_agent
      REDIS_SERVER_HOST: redis
      REDIS_SERVER_PORT: 6379
      REDIS_SERVER_PASSWORD: ${REDIS_PASSWORD}
      OPEN_AGENT_LOCAL_SANDBOX_DIR: /sandbox-spool
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - ./config.json:/app/config.json:ro
      - app_data:/app/data
      - sandbox_spool:/sandbox-spool
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/auth/session').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-init:
        condition: service_completed_successfully
      sandbox:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    mem_limit: 1792m
    networks: [backend, ai, egress]

networks:
  backend:
    internal: true
  ai:
    internal: true
  egress:

volumes:
  postgres_data:
  redis_data:
  app_data:
  sandbox_spool:
  ollama_data:
